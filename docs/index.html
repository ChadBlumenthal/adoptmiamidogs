function photo(d){return !d.photo||/No_pic/i.test(d.photo)?`<div class="ph none"><span class="paw">🐾</span>`:`<div class="ph"><img loading="lazy" src="${esc(d.photo)}" alt="${esc(d.name)}" onload="if(this.naturalWidth==232&&this.naturalHeight==246)this.onerror()" onerror="this.parentNode.classList.add('none');this.replaceWith(Object.assign(document.createElement('span'),{textContent:'🐾',className:'paw'}))">`}
function render(){const t=T[lang],q=F.q.toLowerCase();
 const ds0=data.dogs.filter(d=>(!F.size||d.size==F.size)&&(!F.age_group||d.age_group==F.age_group)&&(!F.sex||d.sex.toLowerCase()==F.sex)&&(!F.shelter||d.shelter==F.shelter)&&(!F.region||regionOf(d.shelter)==F.region)&&(!q||hay(d).includes(q))&&(!F.onlynew||d.first_seen>=cut));
 let ds=ds0;if(DEEP){const x=data.dogs.find(d=>d.id===DEEP);if(x)ds=[x,...ds0.filter(d=>d!==x)]}
 document.getElementById("count").textContent=ds.length;
 document.getElementById("grid").innerHTML=ds.length?ds.slice(0,400).map((d,i)=>`<a class="card${d.id===DEEP?" hl":""}" id="dog-${esc(d.id)}" href="${esc(d.link)}" target="_blank" rel="noopener" style="animation-delay:${Math.min(i,12)*30}ms">${photo(d)}
 ${d.first_seen>=cut?`<span class="badge">${t.NEW}</span>`:""}<span class="where">📍 ${esc(short(d.shelter))}</span></div>
 <div class="body"><p class="name">${/^(A\d+|new pet)$/i.test(d.name.trim())?`<span style=color:var(--mut)>${t.noname}</span>`:esc(title(d.name))}</p><p class="breed">${esc(d.breed)}</p><div class="tags"><span class="tag">${d.sex.toLowerCase()=="male"?t.male:t.female}</span><span class="tag">${esc(d.age.replace(/ old/,""))}</span><span class="tag">${t[d.size]}${d.weight_lbs?` · ${Math.round(d.weight_lbs)} ${t.lbs}`:""}</span></div></div></a>`).join(""):`<div class="empty" style="grid-column:1/-1">${t.none}</div>`}

function shelters(){return data.shelters||Object.values(SH).map(n=>({name:n,count:data.dogs.filter(d=>d.shelter==n).length}))}
function fmt(t){return t?new Date(t).toLocaleString(lang,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}):"—"}
function renderSh(){const t=T[lang],L=shelters();document.getElementById("shLabel").textContent=t.conn(L.length||2);document.getElementById("shX").setAttribute("aria-label",t.close);
 document.getElementById("shList").innerHTML=L.map(s=>`<div class="shRow"><div class="shIco">🏠</div><div><h4>${esc(s.name)}</h4><div class="loc">${esc([s.city,s.county].filter(Boolean).join(" · "))}</div>
 <div class="shMeta"><span class="cnt">${s.count} ${t.dogsN}</span><span>${t.upd2} ${fmt(s.last_updated||data.updated)}</span></div>
 ${s.adopt_url?`<div style="margin-top:8px"><a href="${esc(s.adopt_url)}" target="_blank" rel="noopener">${t.official} ↗</a></div>`:""}<div class="note">${t.src}${s.source_url?` · <a href="${esc(s.source_url)}" target="_blank" rel="noopener" style="font-size:12px;font-weight:500">24PetConnect</a>`:""}</div></div></div>`).join("")+
 `<div class="shRow soon"><div class="shIco">✨</div><div><h4 style="font-weight:600">${t.soonT}</h4><div class="loc" style="margin:2px 0 0">${t.soonS}</div></div></div>`}
const dlg=document.getElementById("shDlg"),scrim=document.getElementById("scrim"),shBtn=document.getElementById("shBtn");
function openSh(){renderSh();dlg.hidden=scrim.hidden=false;document.body.classList.add("lock");shBtn.setAttribute("aria-expanded","true");requestAnimationFrame(()=>{dlg.classList.add("open");scrim.classList.add("open");document.getElementById("shX").focus()})}
function closeSh(){dlg.classList.remove("open");scrim.classList.remove("open");document.body.classList.remove("lock");shBtn.setAttribute("aria-expanded","false");setTimeout(()=>{dlg.hidden=scrim.hidden=true},300);shBtn.focus()}
shBtn.onclick=openSh;scrim.onclick=closeSh;document.getElementById("shX").onclick=closeSh;
document.addEventListener("keydown",e=>{if(dlg.hidden)return;if(e.key=="Escape")closeSh();if(e.key=="Tab"){const f=[...dlg.querySelectorAll("button,a[href]")],a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement==a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement==z){e.preventDefault();a.focus()}}});
if(location.hash=="#shelters")setTimeout(openSh,600);
{const b=document.getElementById("signup"); if(SIGNUP_URL) b.href=SIGNUP_URL; else {b.removeAttribute("target"); b.href="#alerts"; b.style.opacity=.6; b.title="Alerts launching soon"; b.onclick=e=>{e.preventDefault(); b.querySelector("span").textContent=lang==="es"?"Alertas muy pronto":"Alerts launching soon";};}}
fetch("dogs.json",{cache:"no-store"}).then(r=>r.json()).then(j=>{data=j;document.getElementById("sTotal").textContent=j.count;document.getElementById("sNew").textContent=j.dogs.filter(d=>d.first_seen>=cut).length;
 document.getElementById("upd").textContent=T[lang].updated+" "+new Date(j.updated).toLocaleString(lang,{hour:"numeric",minute:"2-digit",month:"short",day:"numeric"});chips();render();renderSh();if(DEEP){const el=document.getElementById("dog-"+DEEP);if(el){el.scrollIntoView({behavior:"smooth",block:"center"});}}});
setLang(lang);
